<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nama計算機(プライベート用途)</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1e3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nama計算機">
<link rel="apple-touch-icon" href="./Namake192.png">
<style>
:root{
  --bg:#eef1f5;
  --surface:#ffffff;
  --ink:#1c2530;
  --ink-sub:#66707d;
  --border:#dfe4ea;
  --primary:#1e3a5f;
  --primary-dark:#152a45;
  --accent:#c9861f;
  --danger:#c0392b;
  --success:#1f7a4d;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 1px 3px rgba(20,30,45,0.08), 0 6px 16px rgba(20,30,45,0.06);
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font-family:inherit;}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

header{
  position:sticky;top:0;z-index:30;
  background:var(--primary);
  color:#fff;
  display:flex;align-items:center;gap:8px;
  padding:14px 12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.15);
}
header button.back{
  background:none;border:none;color:#fff;
  font-size:20px;line-height:1;padding:6px 8px;
  border-radius:8px;cursor:pointer;visibility:hidden;
}
header button.back.show{visibility:visible;}
header button.back:active{background:rgba(255,255,255,0.15);}
header h1{
  flex:1;text-align:center;margin:0;
  font-size:16px;font-weight:600;letter-spacing:0.02em;
}
header h1 .title-sub{
  font-size:11px;font-weight:400;opacity:0.8;margin-left:3px;letter-spacing:0;
}
header .spacer{width:34px;}
header button.gear{
  background:none;border:none;color:#fff;
  font-size:19px;line-height:1;padding:6px 8px;
  border-radius:8px;cursor:pointer;visibility:hidden;
}
header button.gear.show{visibility:visible;}
header button.gear:active{background:rgba(255,255,255,0.15);}

main{flex:1;padding:16px;padding-bottom:48px;}
.page{display:none;}
.page.active{display:block;}

.sub{color:var(--ink-sub);font-size:13px;margin:0 0 14px;line-height:1.6;}

/* ---------- ホームメニュー ---------- */
#menu-card{
  background:var(--surface);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}
#menu-list{display:flex;flex-direction:column;}
.menu-item{
  display:flex;align-items:stretch;
  border-bottom:1px solid var(--border);
  background:var(--surface);
  touch-action:pan-y;
}
.menu-item:last-child{border-bottom:none;}
.menu-item.dragging{
  box-shadow:0 10px 24px rgba(20,30,45,0.22);
  border-radius:12px;
  position:relative;z-index:5;
}
.handle{
  display:flex;align-items:center;justify-content:center;
  width:42px;color:var(--ink-sub);font-size:18px;
  cursor:grab;touch-action:none;user-select:none;
}
.handle:active{cursor:grabbing;color:var(--primary);}
.menu-btn{
  flex:1;display:flex;align-items:center;gap:12px;
  background:none;border:none;padding:15px 12px 15px 2px;
  font-size:15px;color:var(--ink);text-align:left;cursor:pointer;
}
.menu-btn .icon{font-size:21px;width:26px;text-align:center;}
.menu-btn .label{flex:1;font-weight:500;}
.menu-btn .chev{color:var(--ink-sub);font-size:16px;}

/* ---------- 共通パーツ ---------- */
.card{
  background:var(--surface);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:16px;
  margin-bottom:14px;
}
.section-rule{
  border:none;border-top:1px solid var(--border);
  margin:18px 0;
}
.section-label{
  font-size:12.5px;color:var(--ink-sub);
  margin:0 0 10px;font-weight:600;
}
.field-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.field-row:last-child{margin-bottom:0;}
.field-row label{width:76px;flex-shrink:0;color:var(--ink-sub);font-size:13.5px;}
.field-row input[type=number]{
  flex:1;border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px;font-size:16px;font-family:var(--sans);
  font-variant-numeric:tabular-nums;
}
.date-display{
  flex:1;font-size:14.5px;font-family:var(--sans);
  font-variant-numeric:tabular-nums;
}
.cal-btn{
  background:var(--primary);color:#fff;border:none;
  border-radius:var(--radius-sm);padding:9px 11px;
  cursor:pointer;font-size:16px;flex-shrink:0;
}
.cal-btn:active{background:var(--primary-dark);}
.radio-group{display:flex;gap:18px;margin:12px 0 14px;padding-left:86px;}
.radio-group label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);}

.result-box{
  background:var(--primary);color:#fff;
  border-radius:var(--radius);
  padding:18px 16px;text-align:center;
  font-size:17px;font-weight:600;
  font-family:var(--sans);font-variant-numeric:tabular-nums;
  line-height:1.6;
}
.result-box small{display:block;font-size:12.5px;font-weight:400;opacity:0.75;font-family:var(--sans);margin-bottom:2px;}

/* ---------- 電卓 ---------- */
.calc-display{
  background:#161b13;
  border-radius:var(--radius);
  padding:18px 18px 20px;
  margin-bottom:12px;
  display:flex;flex-direction:column;align-items:flex-end;
}
.calc-expr{
  color:#c9b98a;opacity:0.8;
  font-family:var(--sans);font-variant-numeric:tabular-nums;
  font-size:18px;text-align:right;word-break:break-all;
  min-height:22px;letter-spacing:0.02em;width:100%;
}
.calc-live{
  color:#f2c14e;
  font-family:var(--sans);font-variant-numeric:tabular-nums;
  font-size:32px;text-align:right;word-break:break-all;
  min-height:38px;margin-top:4px;letter-spacing:0.02em;width:100%;
}
.calc-memo{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
.memo-input{
  border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px;font-size:14px;background:var(--surface);color:var(--ink);
}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.calc-grid button{
  padding:20px 0;font-size:20px;border:none;border-radius:12px;
  background:var(--surface);box-shadow:var(--shadow);cursor:pointer;
  font-family:var(--sans);color:var(--ink);
}
.calc-grid button:active{filter:brightness(0.94);}
.calc-grid button.op{background:var(--primary);color:#fff;}
.calc-grid button.eq{background:var(--accent);color:#fff;}
.calc-grid button.fn{background:#dfe4ea;color:var(--ink);}

/* ---------- 予算収支 ---------- */
.expense-add{display:flex;gap:8px;margin-bottom:14px;}
.expense-add input{
  flex:1;border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px;font-size:16px;font-family:var(--sans);font-variant-numeric:tabular-nums;
}
.expense-add button{
  background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);
  padding:0 18px;font-size:15px;cursor:pointer;
}
#expense-list{margin-bottom:14px;max-height:220px;overflow-y:auto;}
.expense-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 4px;border-bottom:1px solid var(--border);
  font-family:var(--sans);font-variant-numeric:tabular-nums;font-size:14.5px;
}
.expense-row:last-child{border-bottom:none;}
.expense-row button{
  background:none;border:none;color:var(--danger);font-size:16px;cursor:pointer;padding:2px 8px;
}
.expense-amount{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;flex:1;}
.expense-edit-input{
  flex:1;border:1px solid var(--primary);border-radius:8px;
  padding:6px 8px;font-family:var(--sans);font-size:14.5px;font-variant-numeric:tabular-nums;
}
.expense-done-btn{
  background:var(--primary);color:#fff;border:none;border-radius:8px;
  padding:6px 12px;margin-left:8px;font-size:13px;cursor:pointer;flex-shrink:0;
}
.btn-block.danger{background:var(--danger);}
.budget-summary{display:flex;justify-content:space-between;align-items:baseline;padding-top:4px;}
.budget-summary .lbl{color:var(--ink-sub);font-size:13px;}
.balance{font-size:24px;font-weight:700;font-family:var(--sans);font-variant-numeric:tabular-nums;}
.balance.plus{color:var(--success);}
.balance.minus{color:var(--danger);}

/* ---------- LINEツール ---------- */
#clip-view{
  width:100%;min-height:72px;resize:vertical;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px;font-size:13.5px;font-family:var(--sans);
  background:#f7f8fa;color:var(--ink);
}
#manual-input{
  width:100%;min-height:64px;resize:vertical;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px;font-size:13.5px;font-family:var(--sans);
}
.btn-block{
  width:100%;background:var(--primary);color:#fff;border:none;
  border-radius:var(--radius-sm);padding:12px 14px;font-size:14.5px;
  cursor:pointer;margin-top:10px;
}
.btn-block:active{background:var(--primary-dark);}
.btn-block.secondary{background:var(--accent);}
.btn-block.muted{background:#9aa5b1;margin-top:10px;}
.settings-toggle-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 2px;border-bottom:1px solid var(--border);
  font-size:14.5px;cursor:pointer;
}
.settings-toggle-row:last-child{border-bottom:none;}
.settings-toggle-row input{width:18px;height:18px;flex-shrink:0;}

/* ---------- 年計算機 ---------- */
.era-result{font-family:var(--sans);font-variant-numeric:tabular-nums;font-size:15px;line-height:1.9;}
.era-result div{border-bottom:1px dashed var(--border);padding:2px 0;}
.era-result div:last-child{border-bottom:none;}
select.plain{
  border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:9px;font-size:15px;background:#fff;
}

/* ---------- トースト ---------- */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);
  background:#161b13;color:#fdf3d7;padding:13px 18px;border-radius:12px;
  font-size:13.5px;line-height:1.5;opacity:0;pointer-events:none;
  transition:opacity .22s ease,transform .22s ease;
  max-width:88%;word-break:break-all;z-index:500;
  box-shadow:0 8px 24px rgba(0,0,0,0.3);
}
#toast.show{opacity:1;transform:translate(-50%,0);}

/* ---------- カレンダーモーダル ---------- */
.modal{position:fixed;inset:0;z-index:600;display:flex;align-items:center;justify-content:center;}
.modal.hidden{display:none;}
.modal-overlay{position:absolute;inset:0;background:rgba(15,20,30,0.5);}
.modal-box{
  position:relative;background:#fff;border-radius:18px;
  padding:18px;width:90%;max-width:360px;z-index:1;
  box-shadow:0 20px 50px rgba(0,0,0,0.3);
}
.cal-header{display:flex;gap:8px;margin-bottom:14px;}
.cal-header select{
  flex:1;padding:9px;border-radius:var(--radius-sm);border:1px solid var(--border);
  font-size:14.5px;font-family:var(--sans);
}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
.cal-wd{font-size:11.5px;color:var(--ink-sub);padding:4px 0;font-weight:600;}
.cal-day{
  padding:9px 0;border:none;background:#f2f4f7;border-radius:8px;cursor:pointer;
  font-size:13.5px;font-family:var(--sans);color:var(--ink);
}
.cal-day:active{background:#dfe4ea;}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--accent);}
.cal-footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.cal-footer button{
  border:none;background:none;color:var(--primary);font-size:14px;cursor:pointer;padding:6px 4px;
}
.cal-footer .close-x{color:var(--ink-sub);font-size:20px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="back" id="btn-back" type="button" aria-label="戻る">←</button>
    <h1 id="page-title">Nama計算機<span class="title-sub">(プライベート用途)</span></h1>
    <button class="gear show" id="btn-settings" type="button" aria-label="設定">⚙</button>
  </header>

  <main>

    <!-- ホーム -->
    <div class="page active" id="page-home">
      <p class="sub">項目をタップして開きます。左端のハンドルをドラッグすると並べ替えできます。</p>
      <div id="menu-card"><div id="menu-list"></div></div>
    </div>

    <!-- (1) 電卓 -->
    <div class="page" id="page-calc">
      <div class="calc-display">
        <div class="calc-expr" id="calc-expr">0</div>
        <div class="calc-live" id="calc-live"></div>
      </div>
      <div class="calc-grid">
        <button class="fn" data-val="AC">AC</button>
        <button class="fn" data-val="()">( )</button>
        <button class="fn" data-val="%">%</button>
        <button class="op" data-val="÷">÷</button>

        <button data-val="7">7</button>
        <button data-val="8">8</button>
        <button data-val="9">9</button>
        <button class="op" data-val="×">×</button>

        <button data-val="4">4</button>
        <button data-val="5">5</button>
        <button data-val="6">6</button>
        <button class="op" data-val="-">−</button>

        <button data-val="1">1</button>
        <button data-val="2">2</button>
        <button data-val="3">3</button>
        <button class="op" data-val="+">+</button>

        <button data-val="0">0</button>
        <button data-val=".">.</button>
        <button class="fn" data-val="back">⌫</button>
        <button class="eq" data-val="=">=</button>
      </div>
      <div class="calc-memo">
        <input type="text" class="memo-input" id="calc-memo-1" placeholder="メモ1">
        <input type="text" class="memo-input" id="calc-memo-2" placeholder="メモ2">
        <input type="text" class="memo-input" id="calc-memo-3" placeholder="メモ3">
      </div>
    </div>

    <!-- (2) 日数計算機 -->
    <div class="page" id="page-days">
      <div class="card">
        <div class="field-row">
          <label>基準日</label>
          <span class="date-display" id="days-base-display">-</span>
          <button class="cal-btn" id="days-cal-btn" type="button">📅</button>
        </div>
        <div class="field-row">
          <label>日数</label>
          <input type="number" id="days-input" value="180" min="0" inputmode="numeric">
        </div>
        <div class="radio-group">
          <label><input type="radio" name="days-dir" value="before"> 前</label>
          <label><input type="radio" name="days-dir" value="after" checked> 後</label>
        </div>
      </div>
      <div class="result-box"><small>結果</small><span id="days-result">-</span></div>
    </div>

    <!-- (3) 予算収支計算機 -->
    <div class="page" id="page-budget">
      <div class="card">
        <div class="field-row">
          <label>予算</label>
          <input type="number" id="budget-input" inputmode="decimal">
          <span>円</span>
        </div>
      </div>
      <div class="card">
        <p class="section-label">出費を入力</p>
        <div class="expense-add">
          <input type="number" id="expense-input" placeholder="出費額" inputmode="decimal">
          <button type="button" id="expense-add-btn">追加</button>
        </div>
        <div id="expense-list"></div>
        <div class="budget-summary">
          <span><span class="lbl">出費合計 </span><span id="expense-total" style="font-family:var(--sans)">0円</span></span>
          <span class="balance plus" id="budget-balance">+0円</span>
        </div>
        <button type="button" class="btn-block danger" id="expense-clear-btn">出費を全クリア</button>
      </div>
    </div>

    <!-- (4) LINE外部ブラウザURL -->
    <div class="page" id="page-line">
      <div class="card">
        <p class="section-label">① クリップボードの中身を確認</p>
        <button type="button" class="btn-block" id="clip-check-btn">クリップボードの中身を確認</button>
        <textarea id="clip-view" readonly placeholder="ここに表示されます"></textarea>

        <hr class="section-rule">

        <p class="section-label">② クリップボードのURLにパラメータを付与</p>
        <button type="button" class="btn-block secondary" id="clip-grant-btn">?openExternalBrowser=1 を付与してコピー</button>

        <hr class="section-rule">

        <p class="section-label">③ 手動でURLを入力して付与</p>
        <textarea id="manual-input" placeholder="ここにURLを貼り付け"></textarea>
        <button type="button" class="btn-block" id="manual-grant-btn">付与してコピー</button>
      </div>
    </div>

    <!-- (5) 「年」計算機 -->
    <div class="page" id="page-year">

      <div class="card">
        <p class="section-label">西暦 → 和暦(全種類)</p>
        <div class="field-row">
          <label>西暦</label>
          <input type="number" id="era-seireki-input" placeholder="例: 2026" inputmode="numeric">
          <span>年</span>
        </div>
        <div class="era-result" id="era-result"></div>

        <hr class="section-rule">

        <p class="section-label">和暦 → 西暦</p>
        <div class="field-row">
          <label>元号</label>
          <select class="plain" id="era-select">
            <option value="令和">令和</option>
            <option value="平成">平成</option>
            <option value="昭和">昭和</option>
            <option value="大正">大正</option>
            <option value="明治">明治</option>
          </select>
          <input type="number" id="era-num-input" placeholder="年" inputmode="numeric" style="max-width:90px">
          <span>年</span>
        </div>
        <div class="era-result" id="era-reverse-result"></div>
      </div>

      <div class="card">
        <p class="section-label">誕生日 → 年齢</p>
        <div class="field-row">
          <label>誕生日</label>
          <span class="date-display" id="age-birth-display">未設定</span>
          <button class="cal-btn" id="age-birth-cal-btn" type="button">📅</button>
        </div>
        <div class="field-row">
          <label>現時点</label>
          <span class="date-display" id="age-ref-display">-</span>
          <button class="cal-btn" id="age-ref-cal-btn" type="button">📅</button>
        </div>
        <div class="result-box" style="margin-top:4px;"><small>年齢</small><span id="age-result">-</span></div>

        <hr class="section-rule">

        <p class="section-label">現在の年齢 → 誕生日の範囲</p>
        <div class="field-row">
          <label>年齢</label>
          <input type="number" id="age-reverse-input" placeholder="例: 30" min="0" inputmode="numeric">
          <span>歳</span>
        </div>
        <div class="era-result" id="age-reverse-result"></div>
      </div>
    </div>

  </main>
</div>

<div id="toast"></div>

<div class="modal hidden" id="calendar-modal">
  <div class="modal-overlay" id="cal-overlay"></div>
  <div class="modal-box">
    <div class="cal-header">
      <select id="cal-year-select"></select>
      <select id="cal-month-select">
        <option value="0">1月</option><option value="1">2月</option><option value="2">3月</option>
        <option value="3">4月</option><option value="4">5月</option><option value="5">6月</option>
        <option value="6">7月</option><option value="7">8月</option><option value="8">9月</option>
        <option value="9">10月</option><option value="10">11月</option><option value="11">12月</option>
      </select>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-footer">
      <button type="button" id="cal-today-btn">今日を選択</button>
      <button type="button" class="close-x" id="cal-close-btn">✕</button>
    </div>
  </div>
</div>

<div class="modal hidden" id="settings-modal">
  <div class="modal-overlay" id="settings-overlay"></div>
  <div class="modal-box">
    <h2 style="margin:0 0 14px;font-size:17px;">設定</h2>
    <p class="section-label">表示する機能</p>
    <div id="settings-menu-toggles"></div>
    <hr class="section-rule">
    <button type="button" class="btn-block secondary" id="settings-install-btn">📲 アプリとしてインストール</button>
    <button type="button" class="btn-block muted" id="settings-close-btn">閉じる</button>
  </div>
</div>

<div class="modal hidden" id="info-modal">
  <div class="modal-overlay" id="info-overlay"></div>
  <div class="modal-box">
    <h2 id="info-title" style="margin:0 0 12px;font-size:17px;"></h2>
    <div id="info-body" class="era-result" style="font-family:var(--sans);"></div>
    <button type="button" class="btn-block" id="info-close-btn">閉じる</button>
  </div>
</div>

<script>
(function(){
"use strict";

var WEEKDAYS = ['日','月','火','水','木','金','土'];

/* ============ ページ切替(戻るボタン対応) ============ */
var MENU_ITEMS = [
  {id:'calc',   icon:'🧮', label:'単なる電卓',            title:'電卓'},
  {id:'days',   icon:'📅', label:'日数計算機',            title:'日数計算機'},
  {id:'budget', icon:'💰', label:'予算収支計算機',        title:'予算収支計算機'},
  {id:'line',   icon:'🔗', label:'LINE外部ブラウザURL',   title:'LINE外部ブラウザURL'},
  {id:'year',   icon:'🎂', label:'「年」計算機',          title:'「年」計算機'}
];
var ORDER_KEY = 'namacalc_menu_order_v1';
var VISIBLE_KEY = 'namacalc_menu_visible_v1';
var BUDGET_KEY = 'namacalc_budget_v1';

/* 画面の表示切替のみを行う(履歴操作はしない) */
function renderPage(id){
  var pages = document.querySelectorAll('.page');
  for (var i=0;i<pages.length;i++){ pages[i].classList.remove('active'); }
  var target = document.getElementById('page-' + id);
  if (!target){ id = 'home'; target = document.getElementById('page-home'); }
  target.classList.add('active');
  var backBtn = document.getElementById('btn-back');
  var gearBtn = document.getElementById('btn-settings');
  var titleEl = document.getElementById('page-title');
  if (id === 'home'){
    backBtn.classList.remove('show');
    gearBtn.classList.add('show');
    titleEl.innerHTML = 'Nama計算機<span class="title-sub">(プライベート用途)</span>';
  } else {
    backBtn.classList.add('show');
    gearBtn.classList.remove('show');
    var item = null;
    for (var j=0;j<MENU_ITEMS.length;j++){ if (MENU_ITEMS[j].id===id) item = MENU_ITEMS[j]; }
    titleEl.textContent = item ? item.title : '';
  }
  window.scrollTo(0,0);
}
/* メニューからの遷移: 履歴に積む → 端末の「戻る」でトップに戻れるようにする */
function navigateTo(id){
  if (id === 'home'){ renderPage('home'); return; }
  history.pushState({page:id}, '', '#' + id);
  renderPage(id);
}
document.getElementById('btn-back').addEventListener('click', function(){
  history.back();
});
window.addEventListener('popstate', function(e){
  var id = (e.state && e.state.page) || 'home';
  renderPage(id);
});
history.replaceState({page:'home'}, '', location.pathname + location.search);

/* ============ トースト ============ */
var toastTimer = null;
function showToast(msg, ms){
  ms = ms || 4000;
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, ms);
}

/* ============ ホームメニュー(並べ替え・表示ON/OFF) ============ */
function loadOrder(){
  var ids = MENU_ITEMS.map(function(m){ return m.id; });
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null'); } catch(e) { saved = null; }
  if (saved && Array.isArray(saved)){
    var validSaved = saved.filter(function(id){ return ids.indexOf(id) !== -1; });
    var missing = ids.filter(function(id){ return validSaved.indexOf(id) === -1; });
    return validSaved.concat(missing);
  }
  return ids;
}
function saveOrder(){
  var children = document.getElementById('menu-list').children;
  var ids = [];
  for (var i=0;i<children.length;i++){ ids.push(children[i].dataset.id); }
  localStorage.setItem(ORDER_KEY, JSON.stringify(ids));
}
function loadMenuVisibility(){
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(VISIBLE_KEY) || 'null'); } catch(e){ saved = null; }
  return (saved && typeof saved === 'object') ? saved : {};
}
function setMenuVisible(id, visible){
  var v = loadMenuVisibility();
  v[id] = visible;
  localStorage.setItem(VISIBLE_KEY, JSON.stringify(v));
}
function renderMenu(){
  var order = loadOrder();
  var visibility = loadMenuVisibility();
  var list = document.getElementById('menu-list');
  list.innerHTML = '';
  order.forEach(function(id){
    if (visibility[id] === false) return;
    var item = null;
    for (var j=0;j<MENU_ITEMS.length;j++){ if (MENU_ITEMS[j].id===id) item = MENU_ITEMS[j]; }
    if (!item) return;
    var row = document.createElement('div');
    row.className = 'menu-item';
    row.dataset.id = id;
    row.innerHTML =
      '<div class="handle">≡</div>' +
      '<button class="menu-btn" type="button">' +
        '<span class="icon">' + item.icon + '</span>' +
        '<span class="label">' + item.label + '</span>' +
        '<span class="chev">›</span>' +
      '</button>';
    row.querySelector('.menu-btn').addEventListener('click', function(){
      navigateTo(this.parentElement.dataset.id);
    });
    attachDrag(row);
    list.appendChild(row);
  });
}
function attachDrag(item){
  var handle = item.querySelector('.handle');
  handle.addEventListener('pointerdown', function(e){
    e.preventDefault();
    var list = document.getElementById('menu-list');
    var dragging = true;
    item.classList.add('dragging');
    try { item.setPointerCapture(e.pointerId); } catch(err){}
    var lastY = e.clientY;

    function move(ev){
      if (!dragging) return;
      var dy = ev.clientY - lastY;
      item.style.transform = 'translateY(' + dy + 'px)';
      var rect = item.getBoundingClientRect();
      var centerY = rect.top + rect.height/2;
      var children = [].slice.call(list.children);
      var itemIndex = children.indexOf(item);
      for (var i=0;i<children.length;i++){
        var sib = children[i];
        if (sib === item) continue;
        var sRect = sib.getBoundingClientRect();
        var sCenter = sRect.top + sRect.height/2;
        var sibIndex = children.indexOf(sib);
        if (sibIndex < itemIndex && centerY < sCenter){
          list.insertBefore(item, sib);
          item.style.transform = 'translateY(0px)';
          lastY = ev.clientY;
          break;
        } else if (sibIndex > itemIndex && centerY > sCenter){
          list.insertBefore(item, sib.nextSibling);
          item.style.transform = 'translateY(0px)';
          lastY = ev.clientY;
          break;
        }
      }
    }
    function up(ev){
      dragging = false;
      try { item.releasePointerCapture(e.pointerId); } catch(err){}
      item.classList.remove('dragging');
      item.style.transform = '';
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      saveOrder();
    }
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  });
}

/* ============ (1) 電卓 ============ */
var calcExpr = '';
var calcJustEquals = false;
var calcLastResult = 0;
var CALC_OPS = ['+','-','×','÷'];

function trimNumber(n){
  return Number(n.toFixed(10)).toString();
}
function safeCalcEval(expr){
  if (expr === '') return 0;
  if (!/^[0-9+\-×÷.%()]+$/.test(expr)) throw new Error('invalid');
  var e = expr.replace(/×/g,'*').replace(/÷/g,'/');
  e = e.replace(/(\d+(\.\d+)?)%/g, '($1/100)');
  var val = Function('"use strict";return (' + e + ')')();
  if (typeof val !== 'number' || !isFinite(val)) throw new Error('inf');
  return val;
}
/* 末尾の演算子・小数点・%・開きカッコを取り除いた上で評価する(途中経過表示・=共通) */
function calcEvalTrimmed(expr){
  var e = expr;
  while (e.length > 0 && ['+','-','×','÷','.','%','('].indexOf(e.slice(-1)) !== -1){
    e = e.slice(0,-1);
  }
  if (e === '') return {ok:false};
  try {
    return {ok:true, value: safeCalcEval(e)};
  } catch(err){
    return {ok:false};
  }
}
function calcHasOperator(expr){
  for (var i=1; i<expr.length; i++){
    if (CALC_OPS.indexOf(expr[i]) !== -1) return true;
  }
  return expr.indexOf('%') !== -1;
}
function calcOpenParenCount(expr){
  var open = (expr.match(/\(/g) || []).length;
  var close = (expr.match(/\)/g) || []).length;
  return open - close;
}
function calcRender(){
  document.getElementById('calc-expr').textContent = calcExpr === '' ? '0' : calcExpr;
  var liveEl = document.getElementById('calc-live');
  if (calcHasOperator(calcExpr)){
    var r = calcEvalTrimmed(calcExpr);
    liveEl.textContent = r.ok ? trimNumber(r.value) : '';
  } else {
    liveEl.textContent = '';
  }
}
function calcInput(val){
  if (val === 'AC'){
    calcExpr = '';
    calcJustEquals = false;
  } else if (val === 'back'){
    calcExpr = calcExpr.slice(0,-1);
    calcJustEquals = false;
  } else if (val === '()'){
    if (calcJustEquals){ calcExpr = ''; calcJustEquals = false; }
    var openCount = calcOpenParenCount(calcExpr);
    var lastChP = calcExpr.slice(-1);
    var canClose = openCount > 0 && lastChP !== '' && CALC_OPS.indexOf(lastChP) === -1 && lastChP !== '(' && lastChP !== '.';
    if (canClose){
      calcExpr += ')';
    } else if (lastChP !== '' && /[0-9)]/.test(lastChP)){
      calcExpr += '×(';
    } else {
      calcExpr += '(';
    }
  } else if (val === '='){
    var r = calcEvalTrimmed(calcExpr);
    if (!r.ok){
      showToast('計算できません');
      return;
    }
    calcLastResult = r.value;
    calcJustEquals = true;
    /* calcExprはそのまま保持し、上段に式・下段に結果を表示し続ける */
  } else if (CALC_OPS.indexOf(val) !== -1){
    if (calcJustEquals){
      calcExpr = trimNumber(calcLastResult) + val;
      calcJustEquals = false;
      calcRender();
      return;
    }
    if (calcExpr === ''){
      if (val === '-') calcExpr = '-';
      calcRender();
      return;
    }
    var lastCh = calcExpr.slice(-1);
    if (CALC_OPS.indexOf(lastCh) !== -1){
      calcExpr = calcExpr.slice(0,-1) + val;
    } else {
      calcExpr += val;
    }
  } else if (val === '%'){
    calcJustEquals = false;
    if (calcExpr !== ''){
      var lastCh2 = calcExpr.slice(-1);
      if (CALC_OPS.indexOf(lastCh2) === -1 && lastCh2 !== '%' && lastCh2 !== '('){
        calcExpr += '%';
      }
    }
  } else if (val === '.'){
    if (calcJustEquals){ calcExpr = ''; calcJustEquals = false; }
    var seg = calcExpr.split(/[+\-×÷(]/).pop();
    if (seg.indexOf('.') !== -1){ calcRender(); return; }
    calcExpr += (seg === '' ? '0.' : '.');
  } else {
    if (calcJustEquals){ calcExpr = ''; calcJustEquals = false; }
    calcExpr += val;
  }
  calcRender();
}
var calcButtons = document.querySelectorAll('.calc-grid button');
for (var ci=0; ci<calcButtons.length; ci++){
  calcButtons[ci].addEventListener('click', function(){ calcInput(this.dataset.val); });
}

/* ============ 日付ユーティリティ・和暦 ============ */
function seirekiStr(d){
  return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日(' + WEEKDAYS[d.getDay()] + ')';
}
var ERAS = [
  {name:'令和', start:'2019-05-01'},
  {name:'平成', start:'1989-01-08'},
  {name:'昭和', start:'1926-12-25'},
  {name:'大正', start:'1912-07-30'},
  {name:'明治', start:'1868-01-25'}
];
function dateToWareki(d){
  for (var i=0;i<ERAS.length;i++){
    var sd = new Date(ERAS[i].start + 'T00:00:00');
    if (d >= sd){
      return {name:ERAS[i].name, year: d.getFullYear() - sd.getFullYear() + 1};
    }
  }
  return null;
}
function warekiStr(d){
  var w = dateToWareki(d);
  return w ? (w.name + w.year + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日') : '(明治以前)';
}

/* ============ (2) 日数計算機 ============ */
var daysBaseDate = new Date();
function updateDaysCalc(){
  var days = parseInt(document.getElementById('days-input').value, 10);
  if (isNaN(days)) days = 0;
  var dirEl = document.querySelector('input[name="days-dir"]:checked');
  var dir = dirEl ? dirEl.value : 'after';
  var result = new Date(daysBaseDate);
  result.setDate(result.getDate() + (dir === 'after' ? days : -days));
  document.getElementById('days-base-display').textContent = seirekiStr(daysBaseDate);
  document.getElementById('days-result').textContent = seirekiStr(result) + ' / ' + warekiStr(result);
}
document.getElementById('days-cal-btn').addEventListener('click', function(){
  openCalendar(daysBaseDate, function(d){ daysBaseDate = d; updateDaysCalc(); });
});
document.getElementById('days-input').addEventListener('input', updateDaysCalc);
var dirRadios = document.querySelectorAll('input[name="days-dir"]');
for (var di=0; di<dirRadios.length; di++){
  dirRadios[di].addEventListener('change', updateDaysCalc);
}

/* ============ (3) 予算収支計算機 ============ */
var expenses = [];
var editingExpenseIndex = null;
var EXPENSES_KEY = 'namacalc_expenses_v1';
function loadExpenses(){
  try {
    var saved = JSON.parse(localStorage.getItem(EXPENSES_KEY) || 'null');
    if (Array.isArray(saved)){
      expenses = saved.filter(function(v){ return typeof v === 'number' && isFinite(v); });
    }
  } catch(e){ /* ignore */ }
}
function saveExpenses(){
  localStorage.setItem(EXPENSES_KEY, JSON.stringify(expenses));
}
function initBudget(){
  var saved = localStorage.getItem(BUDGET_KEY);
  document.getElementById('budget-input').value = (saved !== null && saved !== '') ? saved : 20000;
  loadExpenses();
  renderBudget();
}
document.getElementById('budget-input').addEventListener('input', function(e){
  localStorage.setItem(BUDGET_KEY, e.target.value);
  renderBudget();
});
function addExpense(){
  var input = document.getElementById('expense-input');
  var val = parseFloat(input.value);
  if (!isNaN(val) && val !== 0){
    expenses.push(val);
    input.value = '';
    renderBudget();
  }
  input.focus();
}
document.getElementById('expense-add-btn').addEventListener('click', addExpense);
document.getElementById('expense-input').addEventListener('keydown', function(e){
  if (e.key === 'Enter'){ e.preventDefault(); addExpense(); }
});
function removeExpense(idx){
  expenses.splice(idx,1);
  if (editingExpenseIndex === idx) editingExpenseIndex = null;
  renderBudget();
}
document.getElementById('expense-clear-btn').addEventListener('click', function(){
  if (expenses.length === 0) return;
  if (window.confirm('出費の入力内容をすべて削除しますか？')){
    expenses = [];
    editingExpenseIndex = null;
    renderBudget();
  }
});
function renderBudget(){
  var budget = parseFloat(document.getElementById('budget-input').value);
  if (isNaN(budget)) budget = 0;
  var total = expenses.reduce(function(a,b){ return a+b; }, 0);
  var balance = budget - total;
  var list = document.getElementById('expense-list');
  list.innerHTML = '';
  expenses.forEach(function(val, i){
    var row = document.createElement('div');
    row.className = 'expense-row';
    if (i === editingExpenseIndex){
      var input = document.createElement('input');
      input.type = 'number';
      input.inputMode = 'decimal';
      input.className = 'expense-edit-input';
      input.value = val;
      var doneBtn = document.createElement('button');
      doneBtn.type = 'button';
      doneBtn.className = 'expense-done-btn';
      doneBtn.textContent = '確定';
      var committed = false;
      function commit(){
        if (committed) return;
        committed = true;
        var nv = parseFloat(input.value);
        if (!isNaN(nv)) expenses[i] = nv;
        editingExpenseIndex = null;
        renderBudget();
      }
      doneBtn.addEventListener('click', commit);
      input.addEventListener('keydown', function(e){
        if (e.key === 'Enter'){ e.preventDefault(); commit(); }
      });
      input.addEventListener('blur', commit);
      row.appendChild(input);
      row.appendChild(doneBtn);
      list.appendChild(row);
      setTimeout(function(){ input.focus(); input.select(); }, 0);
    } else {
      var amountSpan = document.createElement('span');
      amountSpan.className = 'expense-amount';
      amountSpan.textContent = val.toLocaleString() + '円';
      amountSpan.title = 'タップして訂正';
      amountSpan.addEventListener('click', function(){
        editingExpenseIndex = i;
        renderBudget();
      });
      var delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.textContent = '×';
      delBtn.addEventListener('click', function(){ removeExpense(i); });
      row.appendChild(amountSpan);
      row.appendChild(delBtn);
      list.appendChild(row);
    }
  });
  document.getElementById('expense-total').textContent = total.toLocaleString() + '円';
  var balEl = document.getElementById('budget-balance');
  balEl.textContent = (balance >= 0 ? '+' : '') + balance.toLocaleString() + '円';
  balEl.className = 'balance ' + (balance >= 0 ? 'plus' : 'minus');
  saveExpenses();
}

/* ============ (4) LINE外部ブラウザURL ============ */
document.getElementById('clip-check-btn').addEventListener('click', function(){
  navigator.clipboard.readText().then(function(text){
    document.getElementById('clip-view').value = text;
    var manual = document.getElementById('manual-input');
    if (manual.value.trim() === ''){
      manual.value = text;
    }
  }).catch(function(){
    showToast('クリップボードを読み取れませんでした');
  });
});
function appendParam(url){
  var trimmed = (url || '').trim();
  if (!/^https?:\/\/\S+$/i.test(trimmed)){
    return {ok:false, message:'クリップボードの内容はURLではないようです'};
  }
  if (/[?&]openExternalBrowser=1(&|$)/.test(trimmed)){
    return {ok:false, message:'すでに付与されています: ' + trimmed};
  }
  var sep = trimmed.indexOf('?') !== -1 ? '&' : '?';
  return {ok:true, result: trimmed + sep + 'openExternalBrowser=1'};
}
document.getElementById('clip-grant-btn').addEventListener('click', function(){
  navigator.clipboard.readText().then(function(text){
    var r = appendParam(text);
    if (!r.ok){ showToast(r.message); return; }
    navigator.clipboard.writeText(r.result).then(function(){
      showToast(r.result);
    }).catch(function(){
      showToast(r.result + '(コピーに失敗しました)');
    });
  }).catch(function(){
    showToast('クリップボードを読み取れませんでした');
  });
});
document.getElementById('manual-grant-btn').addEventListener('click', function(){
  var ta = document.getElementById('manual-input');
  var r = appendParam(ta.value);
  if (!r.ok){ showToast(r.message); return; }
  ta.value = r.result;
  navigator.clipboard.writeText(r.result).then(function(){
    showToast('コピーしました: ' + r.result);
  }).catch(function(){
    showToast('コピーに失敗しました');
  });
});

/* ============ (5) 「年」計算機 ============ */
function updateEraFromSeireki(){
  var y = parseInt(document.getElementById('era-seireki-input').value, 10);
  var box = document.getElementById('era-result');
  if (isNaN(y)){ box.innerHTML = ''; return; }
  var lines = [];
  for (var i=ERAS.length-1; i>=0; i--){
    var era = ERAS[i];
    var sy = parseInt(era.start.slice(0,4), 10);
    var ey = y - sy + 1;
    if (ey >= 1) lines.push('<div>' + era.name + ey + '年</div>');
  }
  box.innerHTML = lines.join('');
}
function updateSeirekiFromEra(){
  var eraName = document.getElementById('era-select').value;
  var n = parseInt(document.getElementById('era-num-input').value, 10);
  var box = document.getElementById('era-reverse-result');
  if (isNaN(n)){ box.innerHTML = ''; return; }
  var era = null;
  for (var i=0;i<ERAS.length;i++){ if (ERAS[i].name === eraName) era = ERAS[i]; }
  var sy = parseInt(era.start.slice(0,4), 10);
  box.innerHTML = '<div>西暦 ' + (sy + n - 1) + '年</div>';
}
document.getElementById('era-seireki-input').addEventListener('input', updateEraFromSeireki);
document.getElementById('era-select').addEventListener('change', updateSeirekiFromEra);
document.getElementById('era-num-input').addEventListener('input', updateSeirekiFromEra);

var ageBirthDate = null;
var ageRefDate = new Date();
function updateAge(){
  document.getElementById('age-ref-display').textContent = seirekiStr(ageRefDate);
  var box = document.getElementById('age-result');
  if (!ageBirthDate){
    document.getElementById('age-birth-display').textContent = '未設定';
    box.textContent = '-';
    return;
  }
  document.getElementById('age-birth-display').textContent = seirekiStr(ageBirthDate) + ' / ' + warekiStr(ageBirthDate);
  var age = ageRefDate.getFullYear() - ageBirthDate.getFullYear();
  var hadBirthday = (ageRefDate.getMonth() > ageBirthDate.getMonth()) ||
    (ageRefDate.getMonth() === ageBirthDate.getMonth() && ageRefDate.getDate() >= ageBirthDate.getDate());
  if (!hadBirthday) age--;
  box.textContent = age + '歳';
}
document.getElementById('age-birth-cal-btn').addEventListener('click', function(){
  openCalendar(ageBirthDate || new Date(), function(d){ ageBirthDate = d; updateAge(); });
});
document.getElementById('age-ref-cal-btn').addEventListener('click', function(){
  openCalendar(ageRefDate, function(d){ ageRefDate = d; updateAge(); });
});

function updateAgeReverse(){
  var n = parseInt(document.getElementById('age-reverse-input').value, 10);
  var box = document.getElementById('age-reverse-result');
  if (isNaN(n) || n < 0){ box.innerHTML = ''; return; }
  var ref = new Date();
  var earliest = new Date(ref.getFullYear() - (n+1), ref.getMonth(), ref.getDate());
  earliest.setDate(earliest.getDate() + 1);
  var latest = new Date(ref.getFullYear() - n, ref.getMonth(), ref.getDate());
  box.innerHTML =
    '<div>' + seirekiStr(earliest) + ' / ' + warekiStr(earliest) + '</div>' +
    '<div style="text-align:center;color:var(--ink-sub);border-bottom:none;">〜</div>' +
    '<div>' + seirekiStr(latest) + ' / ' + warekiStr(latest) + '</div>';
}
document.getElementById('age-reverse-input').addEventListener('input', updateAgeReverse);

/* ============ カレンダーモーダル(共通部品) ============ */
var calState = {year:2026, month:0, callback:null};
function openCalendar(initDate, callback){
  calState.year = initDate.getFullYear();
  calState.month = initDate.getMonth();
  calState.callback = callback;
  renderCalendar();
  document.getElementById('calendar-modal').classList.remove('hidden');
}
function closeCalendar(){
  document.getElementById('calendar-modal').classList.add('hidden');
}
document.getElementById('cal-close-btn').addEventListener('click', closeCalendar);
document.getElementById('cal-overlay').addEventListener('click', closeCalendar);
function renderCalendar(){
  var yearSel = document.getElementById('cal-year-select');
  if (yearSel.children.length === 0){
    for (var y=1900; y<=2100; y++){
      var opt = document.createElement('option');
      opt.value = y; opt.textContent = y + '年';
      yearSel.appendChild(opt);
    }
  }
  yearSel.value = calState.year;
  document.getElementById('cal-month-select').value = calState.month;

  var grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  WEEKDAYS.forEach(function(w){
    var el = document.createElement('div');
    el.className = 'cal-wd';
    el.textContent = w;
    grid.appendChild(el);
  });
  var first = new Date(calState.year, calState.month, 1);
  var startOffset = first.getDay();
  var daysInMonth = new Date(calState.year, calState.month+1, 0).getDate();
  for (var i=0;i<startOffset;i++){ grid.appendChild(document.createElement('div')); }
  var today = new Date();
  for (var d=1; d<=daysInMonth; d++){
    (function(dNum){
      var cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'cal-day';
      cell.textContent = dNum;
      if (calState.year === today.getFullYear() && calState.month === today.getMonth() && dNum === today.getDate()){
        cell.classList.add('today');
      }
      cell.addEventListener('click', function(){
        var picked = new Date(calState.year, calState.month, dNum);
        closeCalendar();
        if (calState.callback) calState.callback(picked);
      });
      grid.appendChild(cell);
    })(d);
  }
}
document.getElementById('cal-year-select').addEventListener('change', function(e){
  calState.year = parseInt(e.target.value, 10); renderCalendar();
});
document.getElementById('cal-month-select').addEventListener('change', function(e){
  calState.month = parseInt(e.target.value, 10); renderCalendar();
});
document.getElementById('cal-today-btn').addEventListener('click', function(){
  var t = new Date();
  closeCalendar();
  if (calState.callback) calState.callback(t);
});

/* ============ 汎用インフォモーダル ============ */
function showInfoModal(title, bodyHTML){
  document.getElementById('info-title').textContent = title;
  document.getElementById('info-body').innerHTML = bodyHTML;
  document.getElementById('info-modal').classList.remove('hidden');
}
function closeInfoModal(){
  document.getElementById('info-modal').classList.add('hidden');
}
document.getElementById('info-close-btn').addEventListener('click', closeInfoModal);
document.getElementById('info-overlay').addEventListener('click', closeInfoModal);

/* ============ 設定モーダル(表示項目の切替) ============ */
function renderSettingsToggles(){
  var box = document.getElementById('settings-menu-toggles');
  box.innerHTML = '';
  var visibility = loadMenuVisibility();
  MENU_ITEMS.forEach(function(item){
    var checked = visibility[item.id] !== false;
    var row = document.createElement('label');
    row.className = 'settings-toggle-row';
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = checked;
    var span = document.createElement('span');
    span.textContent = item.icon + ' ' + item.label;
    row.appendChild(cb);
    row.appendChild(span);
    cb.addEventListener('change', function(){
      setMenuVisible(item.id, cb.checked);
      renderMenu();
    });
    box.appendChild(row);
  });
}
function openSettingsModal(){
  renderSettingsToggles();
  document.getElementById('settings-modal').classList.remove('hidden');
}
function closeSettingsModal(){
  document.getElementById('settings-modal').classList.add('hidden');
}
document.getElementById('btn-settings').addEventListener('click', openSettingsModal);
document.getElementById('settings-close-btn').addEventListener('click', closeSettingsModal);
document.getElementById('settings-overlay').addEventListener('click', closeSettingsModal);

/* ============ PWAインストールボタン ============ */
var deferredInstallPrompt = null;
var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !/crios/i.test(navigator.userAgent);
var isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
  ('standalone' in navigator && navigator.standalone === true);

window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredInstallPrompt = e;
});
window.addEventListener('appinstalled', function(){
  deferredInstallPrompt = null;
  showToast('ホーム画面に追加しました');
});
document.getElementById('settings-install-btn').addEventListener('click', function(){
  if (isStandalone){
    showInfoModal('インストール済み', '<div>このアプリはすでにホーム画面に追加されています。</div>');
    return;
  }
  if (deferredInstallPrompt){
    var promptEvent = deferredInstallPrompt;
    deferredInstallPrompt = null;
    promptEvent.prompt();
    promptEvent.userChoice.then(function(){ /* 結果に関わらずイベントは再利用不可のため破棄済み */ });
    return;
  }
  if (isIOS){
    showInfoModal('iOSへのインストール方法',
      '<div>Safariでこのページを開いてください。</div>' +
      '<div>① 画面下部の共有ボタン（□↑）をタップ</div>' +
      '<div>② 「ホーム画面に追加」を選択</div>' +
      '<div>③ 右上の「追加」をタップ</div>' +
      '<div style="opacity:0.7;">※ Chrome・Firefoxでは対応していません。</div>');
    return;
  }
  showInfoModal('インストール方法',
    '<div>Chrome: アドレスバー右端の「⊕」または「⋮」→「アプリをインストール」</div>' +
    '<div>Edge: 「…」→「アプリ」→「このサイトをアプリとしてインストール」</div>' +
    '<div>Safari(Mac): メニューFile→「Dockに追加」</div>' +
    '<div style="opacity:0.7;">※ Firefoxはインストールに対応していません。</div>');
});

/* ============ PWA: Service Worker登録 ============ */
if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(err){
      console.warn('SW registration failed', err);
    });
  });
  navigator.serviceWorker.addEventListener('message', function(event){
    if (event.data && event.data.type === 'sw_updated'){
      showToast('新しいバージョンを適用しました。再読み込みしてください', 6000);
    }
  });
}

})();
